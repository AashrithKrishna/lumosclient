name: lumos capes
# Builds the LumosCapes Fabric mod (obsidian-launcher-rs/lumoscapes) and tests the capes server
# (capes-server). The jar is uploaded as the "lumoscapes" artifact; build_app.sh and
# package_windows.sh bundle obsidian-launcher-rs/lumoscapes/build/libs/lumoscapes-1.21.11.jar.

on:
  push:
    paths:
      - 'obsidian-launcher-rs/lumoscapes/**'
      - 'capes-server/**'
      - '.github/workflows/lumos-capes.yml'
  pull_request:
    paths:
      - 'obsidian-launcher-rs/lumoscapes/**'
      - 'capes-server/**'
      - '.github/workflows/lumos-capes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mod:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: obsidian-launcher-rs/lumoscapes
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: lumoscapes
          path: obsidian-launcher-rs/lumoscapes/build/libs/lumoscapes-1.21.11.jar
          if-no-files-found: error

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capes-server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm test
