[workspace]

[package]
name = "lumos-launcher"
version = "0.4.6"
edition = "2021"

[dependencies]
tao = "0.30"
wry = "0.47"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json", "native-certs"] }
dirs = "5"
base64 = "0.22"
sha1_smol = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
minisign-verify = "0.2"
# mod_plan.rs: Horizon manifests (horizon-mod.toml) and their version requirements.
toml = "0.8"
semver = "1"

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.15"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_SystemInformation"] }
trash = "5"

# Already part of tao/wry on Linux; used to name the window for the desktop entry.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[build-dependencies]
winresource = "0.1"
