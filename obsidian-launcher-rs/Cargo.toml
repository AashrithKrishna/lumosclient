[workspace]

[package]
name = "lumos-launcher"
version = "0.3.0"
edition = "2021"

[dependencies]
tao = "0.30"
wry = "0.47"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json", "native-certs"] }
dirs = "5"
base64 = "0.22"
sha1_smol = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.15"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_SystemInformation"] }
trash = "5"

[build-dependencies]
winresource = "0.1"
