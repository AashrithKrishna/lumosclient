# Lumos Paginated Advancements: the Advancements screen's tabs in pages, so every tab is reachable.
[mod]
id = "lumos_paginated_advancements"
version = "1.0.0"
priority = 100

# Horizon Nightly 2026-11-13. Planned with horizon-mixins e59da9094f0c2fdda6c627fe9eff22dec6a906f0.
[compatibility]
horizon_revision = "9f42064c11efe7ef3e5ed2baad7ddc2a3b36eea0"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "lumos_paginated_advancements"
source = "runtime.rs"

[[module]]
id = "glue"
file = "crates/horizon-client/src/game.rs"
name = "lumos_paginated_advancements_glue"
source = "glue.rs"

# The screen's view keeps every displayed root (vanilla cuts the list at its 26 tab places)...
[[injection]]
id = "view-all-tabs"
kind = "MODIFY_CONSTANT"
target = "horizon_client::game::advancements_screen::Game<'_>::adv_view"
selector = "26"
require = 1
ordinal = 0
helper = "hooks/view_all.rs"
bindings = [{ name = "value", ty = "usize", value = "$value" }]

# ...and shows one page of them (or vanilla's 26 with the mod off). Drawing, tooltips and
# clicks all read this view, so they agree on the page.
[[injection]]
id = "view-page"
kind = "RETURN"
target = "horizon_client::game::advancements_screen::Game<'_>::adv_view"
helper = "hooks/view_page.rs"
bindings = [
  { name = "value", ty = "View", value = "$value" },
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
]

[[injection]]
id = "open"
kind = "HEAD"
target = "horizon_client::game::advancements_screen::Game<'_>::open_advancements"
helper = "hooks/open.rs"
bindings = []

# The page buttons and number, over the finished screen.
[[injection]]
id = "render"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_screen_render_post"
helper = "hooks/render.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "batch", ty = "&mut HudBatch", value = "&mut *batch" },
  { name = "screen", ty = "&NativeScreenView<'_>", value = "screen" },
]

# A left press on a page button turns the page instead of reaching the tabs or the tree.
[[injection]]
id = "mouse"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::advancements_screen::Game<'_>::advancements_mouse"
helper = "hooks/mouse.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pressed", ty = "bool", value = "pressed" },
  { name = "size", ty = "[u32; 2]", value = "size" },
]

# The wheel over the tabs turns the page; over the tree it still scrolls the tree.
[[injection]]
id = "scroll"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::advancements_screen::Game<'_>::advancements_scroll"
helper = "hooks/scroll.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "y", ty = "f32", value = "y" },
]

# Page Up / Page Down.
[[injection]]
id = "key"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_screen_key_pressed_pre"
helper = "hooks/key.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "screen", ty = "&NativeScreenView<'_>", value = "screen" },
  { name = "key", ty = "&str", value = "key" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "hooks/list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "settings"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings"
helper = "hooks/settings.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "click"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings_click"
helper = "hooks/click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]
