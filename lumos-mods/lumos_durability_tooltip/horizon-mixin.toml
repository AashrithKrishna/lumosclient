# Lumos Durability Tooltip: "Durability: 123 / 250" on every damageable item's tooltip.
[mod]
id = "lumos_durability_tooltip"
version = "1.0.0"
priority = 100

# Horizon Nightly 2026-11-13. Planned with horizon-mixins e59da9094f0c2fdda6c627fe9eff22dec6a906f0.
[compatibility]
horizon_revision = "9f42064c11efe7ef3e5ed2baad7ddc2a3b36eea0"

# The rules (no game types; its tests run on their own).
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "lumos_durability_tooltip"
source = "runtime.rs"

# What reads the game.
[[module]]
id = "glue"
file = "crates/horizon-client/src/game.rs"
name = "lumos_durability_tooltip_glue"
source = "glue.rs"

# Every item tooltip, after the game built its lines (API 12).
[[injection]]
id = "tooltip"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_tooltip"
helper = "hooks/tooltip.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "stack", ty = "&ItemStack", value = "stack" },
  { name = "lines", ty = "&mut Vec<(Text, u32)>", value = "&mut *lines" },
]

# Options > Mods: listed, so it can be switched off (horizon-mods.txt) and set up.
[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "hooks/list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "settings"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings"
helper = "hooks/settings.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "click"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings_click"
helper = "hooks/click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]
